[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "subvoxel-segmentationgan"
version = "0.1.0"
description = "3D conditional GAN for sub-voxel avian eggshell pore segmentation"
readme = "README.md"
requires-python = ">=3.9,<3.11"
license = {file = "LICENSE"}
authors = [{name = "Shumeng Jia"}]
dependencies = [
  "imageio>=2.22,<3",
  "numpy==1.23.5",
  "tensorflow==2.11.0",
  "tifffile>=2022.10.10",
]

[project.optional-dependencies]
dev = ["pytest>=7,<9"]
plot = ["pydot>=1.4,<3"]

[project.scripts]
subvoxel-train = "subvoxel_segmentationgan.entrypoints:train_main"
subvoxel-evaluate = "subvoxel_segmentationgan.entrypoints:evaluate_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
